name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia às 03:17 (horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar os cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }} # opcional: inclui repositórios privados
          PESO_TAMANHO: "0.5"
          PESO_QUANTIDADE: "0.5"
          IGNORAR_LINGUAGENS: ""
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/gerar_stats.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/stats
          git diff --cached --quiet || git commit -m "Atualiza estatísticas do perfil"
          git push
